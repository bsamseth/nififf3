name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  clippy:
    name: Clippy (feature powerset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - uses: Swatinem/rust-cache@v2
      # Every subset of the features, over every target (lib, bins, tests,
      # examples). Targets whose `required-features` are absent are skipped by
      # cargo, so e.g. the `cli` bin is only linted where `cli` is on, and the
      # examples only where `uuid` is.
      - run: cargo hack clippy --feature-powerset --all-targets --locked -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - uses: Swatinem/rust-cache@v2
      # Default features, no features, and each feature on its own. Plain
      # `cargo test` includes doc tests, so they run in every combination.
      - name: Tests per feature
        run: cargo hack test --each-feature --locked
      - name: Tests with all features
        run: cargo test --all-features --locked
      # Redundant with the above, but keeps a failure in a doc example from
      # being reported as just another test failure.
      - name: Doc tests
        run: cargo test --all-features --locked --doc

  doctests:
    name: Doc tests (feature powerset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - uses: Swatinem/rust-cache@v2
      # The clippy powerset above uses `--all-targets`, which excludes doc
      # tests, and the test job's `--each-feature` never turns two features on
      # at once. So a doc example that only exists under one combination, or
      # that uses an item gated behind a feature its own item is not, is
      # checked here and nowhere else.
      - run: cargo hack test --feature-powerset --doc --locked

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Kept in step with `rust-version` in Cargo.toml by hand — the action
      # cannot read it from the manifest. Raising one means raising the other;
      # code that needs a newer toolchain than the manifest promises fails here.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features --all-targets --locked

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Each example builds its own input and asserts its own output, so
      # running it is the check. Discovered from the manifest so a new example
      # is covered without touching this file.
      - name: Build and run each example
        run: |
          status=0
          while IFS= read -r example; do
            echo "::group::cargo run --example $example"
            cargo run --all-features --locked --example "$example" || status=1
            echo "::endgroup::"
          done < <(
            cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[].targets[] | select(.kind[] == "example") | .name' \
              | sort
          )
          exit $status

  publish:
    name: Publish to crates.io
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [clippy, test, doctests, msrv, examples]
    runs-on: ubuntu-latest
    # Trusted publishing: crates.io issues a short-lived token in exchange for
    # GitHub's OIDC token, so there is no registry credential to store here.
    # A job-level block replaces the top-level one rather than adding to it,
    # so `contents: read` is repeated.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the tag matches the manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      # Mints the token from the OIDC identity of this workflow, which
      # crates.io matches against the trusted publisher configured for the
      # crate — repository and *workflow filename*, so moving this job to
      # another file means updating that configuration too. The action's post
      # step revokes the token when the job ends.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
