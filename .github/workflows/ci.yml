name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  clippy:
    name: Clippy (feature powerset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - uses: Swatinem/rust-cache@v2
      # Every subset of the six features, over every target (lib, bins, tests,
      # examples). Targets whose `required-features` are absent are skipped by
      # cargo, so e.g. the `cli` bin is only linted where `cli` is on.
      - run: cargo hack clippy --feature-powerset --all-targets --locked -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - uses: Swatinem/rust-cache@v2
      # Default features, no features, and each feature on its own. Plain
      # `cargo test` includes doc tests, so they run in every combination.
      - name: Tests per feature
        run: cargo hack test --each-feature --locked
      - name: Tests with all features
        run: cargo test --all-features --locked
      # Redundant with the above, but keeps a failure in a doc example from
      # being reported as just another test failure.
      - name: Doc tests
        run: cargo test --all-features --locked --doc

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Each example builds its own input and asserts its own output, so
      # running it is the check. Discovered from the manifest so a new example
      # is covered without touching this file.
      - name: Build and run each example
        run: |
          status=0
          while IFS= read -r example; do
            echo "::group::cargo run --example $example"
            cargo run --all-features --locked --example "$example" || status=1
            echo "::endgroup::"
          done < <(
            cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[].targets[] | select(.kind[] == "example") | .name' \
              | sort
          )
          exit $status

  publish:
    name: Publish to crates.io
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [clippy, test, examples]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the tag matches the manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
