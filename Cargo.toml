[package]
name = "nififf3"
version = "0.3.3"
edition = "2024"
# Let-chains, which this crate uses throughout its parsing code, are stable
# from 1.88 in edition 2024. Verified: 1.88 builds all features against the
# locked dependency set, 1.87 rejects every let-chain.
rust-version = "1.88"
description = "Utilities for working with NiFi FlowFile V3 files: parsing, serialization, CLI and axum integration."
license = "Unlicense"
documentation = "https://docs.rs/nififf3"
repository = "https://github.com/bsamseth/nififf3"
keywords = ["nifi", "flowfile", "apache-nifi", "dataflow", "etl"]
categories = ["encoding", "parser-implementations", "command-line-utilities"]

[package.metadata.docs.rs]
all-features = true
# Turns on the crate's `doc(auto_cfg)`, so gated items say which feature they
# need. Without it every item looks unconditionally available.
rustdoc-args = ["--cfg", "docsrs"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[features]
# `uuid` is on by default: `derive` and `fragments` are core to using this
# crate with NiFi, and both mint identifiers. Turn it off with
# `default-features = false` to keep a parsing-and-serialization build down to
# `thiserror`.
default = ["uuid"]
uuid = ["dep:uuid"]
tokio = ["dep:tokio"]
tempfile = ["dep:tempfile"]
stream = ["tokio", "dep:futures-core"]
axum = [
    "tokio",
    "tokio/rt",
    "stream",
    "dep:axum",
    "dep:tokio-util",
    "tokio-util/io-util",
    "dep:bytes",
    "dep:futures-core",
    "dep:http-body-util",
]
serde = ["dep:serde", "dep:base64"]
cli = ["dep:clap", "dep:serde_json", "serde"]

[dependencies]
thiserror = "2"
uuid = { version = "1", features = ["v4"], optional = true }
tokio = { version = "1", features = ["io-util", "fs"], optional = true }
tempfile = { version = "3", optional = true }
axum = { version = "0.8", optional = true }
tokio-util = { version = "0.7", features = ["io"], optional = true }
bytes = { version = "1", optional = true }
futures-core = { version = "0.3", optional = true }
http-body-util = { version = "0.1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread"] }
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
assert_cmd = "2"
predicates = "3"
async-compression = { version = "0.4", features = ["tokio", "gzip"] }
astral-tokio-tar = "0.6"
tokio-stream = "0.1"

[[bin]]
name = "nififf3"
path = "src/bin/nififf3.rs"
required-features = ["cli"]

# Every example derives or splits flow files, so each needs `uuid`.
[[example]]
name = "transform"
required-features = ["uuid"]

[[example]]
name = "split"
required-features = ["uuid"]

[[example]]
name = "merge"
required-features = ["uuid"]

[[example]]
name = "transform_async"
required-features = ["tokio", "uuid"]

[[example]]
name = "split_async"
required-features = ["tokio", "uuid"]

[[example]]
name = "merge_async"
required-features = ["tokio", "uuid"]

[[example]]
name = "axum_service"
required-features = ["axum", "uuid"]
