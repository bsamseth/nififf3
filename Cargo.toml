[package]
name = "nififf3"
version = "0.1.0"
edition = "2024"
description = "Utilities for working with NiFi FlowFile V3 files: parsing, serialization, CLI and axum integration."
license = "MIT OR Apache-2.0"

[package.metadata.docs.rs]
all-features = true

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[features]
default = []
tokio = ["dep:tokio"]
tempfile = ["dep:tempfile"]
axum = [
    "tokio",
    "tokio/rt",
    "dep:axum",
    "dep:tokio-util",
    "tokio-util/io-util",
    "dep:bytes",
    "dep:futures-core",
    "dep:http-body-util",
]
serde = ["dep:serde", "dep:base64"]
cli = ["dep:clap", "dep:serde_json", "serde"]

[dependencies]
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["io-util", "fs"], optional = true }
tempfile = { version = "3", optional = true }
axum = { version = "0.8", optional = true }
tokio-util = { version = "0.7", features = ["io"], optional = true }
bytes = { version = "1", optional = true }
futures-core = { version = "0.3", optional = true }
http-body-util = { version = "0.1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread"] }
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
assert_cmd = "2"
predicates = "3"
async-compression = { version = "0.4", features = ["tokio", "gzip"] }
astral-tokio-tar = "0.6"
tokio-stream = "0.1"

[[bin]]
name = "nififf3"
path = "src/bin/nififf3.rs"
required-features = ["cli"]

[[example]]
name = "transform_async"
required-features = ["tokio"]

[[example]]
name = "split_async"
required-features = ["tokio"]

[[example]]
name = "merge_async"
required-features = ["tokio"]

[[example]]
name = "axum_service"
required-features = ["axum"]
